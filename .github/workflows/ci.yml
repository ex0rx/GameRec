name: Focused checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+asyncpg://unused:unused@127.0.0.1:1/unused
      STEAM_API_KEY: synthetic-key
      EMBEDDINGS_MODEL_NAME: synthetic-model
      EMBEDDINGS_MODEL_REVISION: synthetic-revision
      QDRANT_GAME_COLLECTION: synthetic-games
      EXPLANATION_CACHE_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check --no-cache .
      - name: Check affected Python formatting
        run: |
          uv run --locked ruff format --check --no-cache \
            src/gamerec/main.py src/gamerec/core/config.py \
            src/gamerec/integrations/ollama.py src/gamerec/integrations/redis.py \
            src/gamerec/services/explanation_cache.py src/gamerec/api/explanations.py \
            src/gamerec/scripts/benchmark_explanations.py tests/conftest.py \
            tests/test_explanation_cache.py tests/test_explanations_api.py \
            tests/test_benchmark_explanations.py
      - name: Run focused regressions with mocked external services
        run: |
          uv run --locked pytest -q -p no:cacheprovider \
            tests/test_explanation_cache.py tests/test_benchmark_explanations.py \
            tests/test_explanations_api.py tests/test_ollama_explanations.py \
            tests/test_evaluate_explanations.py tests/test_explanation_context.py \
            tests/test_verify_search_explanations.py tests/test_search_api.py \
            tests/test_hybrid_user_recommendation.py \
            tests/test_multi_source_user_recommendation.py \
            tests/test_user_recommendation.py tests/test_recommendation_evaluation.py
